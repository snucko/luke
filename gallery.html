<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Watch Magic by Luke perform incredible illusions and tricks. Video performances and event highlights.">
  <title>Gallery - Magic by Luke</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <luke-header></luke-header>
  
  <main>
    <section class="page-hero">
      <h1>Gallery</h1>
      <p>Watch incredible performances and unforgettable moments</p>
    </section>

    <section class="gallery-content">
      <!-- TikTok's embed.js is broken for US visitors (its library 404s and Chrome blocks it),
           so these use TikTok's iframes directly. -->
      <h2>Latest on TikTok</h2>
      <!-- TikTok's creator embed: always shows Luke's newest videos, nothing to update here. -->
      <iframe class="tiktok-profile" src="https://www.tiktok.com/embed/@cequity"
              title="Luke's latest TikTok videos" height="480"
              allow="encrypted-media; fullscreen" loading="lazy"></iframe>

      <h2>Featured</h2>
      <!-- Videos that play on the page. Add one by copying an iframe and changing the ID. -->
      <div class="video-gallery tiktok-videos">
        <iframe src="https://www.tiktok.com/player/v1/7561588816000175415?music_info=1&amp;description=1"
                title="Luke on TikTok" width="325" height="578"
                allow="encrypted-media; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe>
        <iframe src="https://www.tiktok.com/player/v1/7550841538868202807?music_info=1&amp;description=1"
                title="Luke on TikTok" width="325" height="578"
                allow="encrypted-media; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe>
      </div>

      <div class="cta-section" style="margin-top: 3rem;">
        <h2>Want to see Luke perform live?</h2>
        <p>Book a performance for your next event</p>
        <a href="contact.html" class="btn btn-primary">Request a Performance</a>
      </div>
    </section>
  </main>

  <luke-footer></luke-footer>

  <script type="module">
    import './js/components/LukeHeader.js';
    import './js/components/LukeFooter.js';
  </script>
</body>
</html>
